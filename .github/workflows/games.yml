name: Generate Pac-Man and Galaga

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

jobs:
generate:
permissions:
contents: write

```
runs-on: ubuntu-latest

steps:
  - name: Generate Pac-Man and Galaga contribution graphs
    uses: abozanona/pacman-contribution-graph@main
    with:
      github_user_name: ${{ github.repository_owner }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
      github_user_email: ${{ github.repository_owner }}@users.noreply.github.com
      games: "pacman,galaga"
