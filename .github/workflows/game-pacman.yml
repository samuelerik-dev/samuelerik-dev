name: Generate Pac-Man Animation

on:
  schedule:
    # Executa automaticamente a cada 12 horas
    - cron: "0 */12 * * *"

  # Permite executar manualmente pelo GitHub Actions
  workflow_dispatch:

  # Executa quando houver alterações na branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      - name: Push Pac-Man animation to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: pacman-output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
